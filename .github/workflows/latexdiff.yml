name: LaTeX Diff

# Builds a PDF that marks every change between a reference version of the
# manuscript (by default the most recent tag, e.g. the submitted version)
# and the current commit. Run it from the Actions tab: "LaTeX Diff" > "Run workflow".

on:
  workflow_dispatch:
    inputs:
      compare_with:
        description: 'Tag or commit to compare with (leave empty for the latest tag)'
        required: false
        default: ''

env:
  TEX_FILE: manuscript_edds_Verification   # main .tex file, without extension

jobs:
  latexdiff:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Get comparison reference
      id: ref
      env:
        COMPARE_WITH: ${{ github.event.inputs.compare_with }}
      run: |
        if [ -n "$COMPARE_WITH" ]; then
          REF="$COMPARE_WITH"
        else
          REF=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$REF" ]; then
            echo "::error::No tags found. Provide a tag/commit via the compare_with input."
            exit 1
          fi
        fi
        if ! git rev-parse --verify --quiet "$REF^{commit}" > /dev/null; then
          echo "::error::'$REF' is not a tag or commit in this repository."
          exit 1
        fi
        echo "ref=$REF" >> "$GITHUB_OUTPUT"
        echo "name=$(echo "$REF" | tr -c 'A-Za-z0-9._\n-' '_')" >> "$GITHUB_OUTPUT"
        echo "Comparing $REF with $(git rev-parse --short HEAD)"

    - name: Install LaTeX and latexdiff
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive-latex-base \
          texlive-latex-recommended \
          texlive-latex-extra \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          texlive-publishers \
          texlive-science \
          texlive-lang-french \
          tex-gyre \
          latexdiff

    - name: Build old and new versions (for bibliographies)
      env:
        REF: ${{ steps.ref.outputs.ref }}
      run: |
        mkdir -p old
        git archive "$REF" | tar -x -C old
        # The repository bundles asmejour.cls v1.18, which fails with current
        # LaTeX kernels; use the class shipped with TeX Live instead.
        for dir in old .; do
          (
            cd "$dir"
            rm -f asmejour.cls
            pdflatex -interaction=nonstopmode "$TEX_FILE.tex" > /dev/null || true
            bibtex "$TEX_FILE" || true
            pdflatex -interaction=nonstopmode "$TEX_FILE.tex" > /dev/null || true
            test -f "$TEX_FILE.bbl" || { echo "::error::No bibliography produced in $dir"; exit 1; }
          )
        done

    - name: Run latexdiff
      run: |
        # --flatten inlines \input files and each version's .bbl, so the
        # reference list is diffed too. Wide tables (table*) are shown as
        # whole old/new blocks, because cell-level markup in heavily
        # restructured tables breaks \midrule.
        latexdiff --flatten --encoding=utf8 \
          --config='PICTUREENV=(?:picture|DIFnomarkup)[\w\d*@]*|table\*' \
          "old/$TEX_FILE.tex" "$TEX_FILE.tex" > diff.tex 2> latexdiff.log

    - name: Compile diff PDF
      run: |
        pdflatex -interaction=nonstopmode diff.tex > /dev/null || true
        pdflatex -interaction=nonstopmode diff.tex > /dev/null || true
        test -f diff.pdf || { echo "::error::diff.pdf was not produced; see diff.log"; exit 1; }
        # Report LaTeX errors without failing, as Overleaf does.
        grep -A2 '^!' diff.log | while IFS= read -r line; do echo "::warning::$line"; done || true

    - name: Upload diff PDF as artifact
      uses: actions/upload-artifact@v4
      with:
        name: latexdiff-${{ steps.ref.outputs.name }}
        path: |
          diff.pdf
          diff.tex
          diff.log
          latexdiff.log
